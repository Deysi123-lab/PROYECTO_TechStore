server:
  port: 9111

spring:
  datasource:
    url: jdbc:mysql://localhost:3411/db_pago?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:7081/eureka

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:41092}
  consumer:
    group-id: pago-consumer
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "com.upeu.pago.event,com.upeu.pedido.event,*"
      spring.json.value.default.type: com.upeu.pago.event.OrdenCreadaEvent
      spring.json.use.type.headers: false

app:
  kafka:
    topics:
      orden-eventos: orden-eventos

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.upeu.pago: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
